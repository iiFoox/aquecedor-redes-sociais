<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WarmUp Studio</title>
    <meta name="description" content="Painel do aquecimento das contas do TikTok e do Instagram" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2.6c.7 3 4.6 5.1 4.6 9.9a4.6 4.6 0 0 1-9.2 0c0-2.1 1-3.5 2.3-4.6.1 1.9.9 3 2 3.4-.5-2.9 0-5.9.3-8.7z' fill='%23ff3d7f'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Tema escolhido em Ajustes, aplicado antes de desenhar (sem piscar)
      try {
        const t = localStorage.getItem('ws-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <canvas id="confetti" aria-hidden="true"></canvas>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
